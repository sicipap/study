<style>
:root {
  --paper: #F3F5F1;
  --surface: #FFFFFF;
  --sunken: #E9EEE8;
  --ink: #17221D;
  --muted: #5A6A62;
  --line: #D9E1DA;
  --accent: #0B6E4F;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEFE6;
  --red: #C2372B;
  --red-soft: #F8E1DE;
  --amber: #A86A12;
  --amber-soft: #F6EBD6;
  --good: #1D7A4E;
  --good-soft: #DCEFE3;
  --display: "Tiro Bangla", "Noto Serif Bengali", Georgia, serif;
  --body: "Hind Siliguri", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0E1512; --surface: #151F1B; --sunken: #1B2722; --ink: #E4ECE7; --muted: #95A69D; --line: #283630;
    --accent: #3DB487; --accent-ink: #06140E; --accent-soft: #173A2C;
    --red: #EF6A5E; --red-soft: #3A1D1A; --amber: #E2AA4F; --amber-soft: #36290F; --good: #4CC08A; --good-soft: #15362A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0E1512; --surface: #151F1B; --sunken: #1B2722; --ink: #E4ECE7; --muted: #95A69D; --line: #283630;
  --accent: #3DB487; --accent-ink: #06140E; --accent-soft: #173A2C;
  --red: #EF6A5E; --red-soft: #3A1D1A; --amber: #E2AA4F; --amber-soft: #36290F; --good: #4CC08A; --good-soft: #15362A;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--body); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.25; text-wrap: balance; margin: 0; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.top { border-bottom: 1px solid var(--line); background: var(--surface); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.brand b { font: 400 24px/1 var(--display); }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; font-weight: 500; }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
nav.tabs a:hover { color: var(--ink); }
.sync { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync[data-s="saved"] i { background: var(--good); }
.sync[data-s="saving"] i { background: var(--amber); }
.sync[data-s="error"] i { background: var(--red); }

main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px; }

/* ---------- shared pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.card h2 { font-size: 22px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--amber-soft); color: var(--amber); }
.chip.bad { background: var(--red-soft); color: var(--red); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.bar { height: 8px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.empty { color: var(--muted); padding: 8px 0; }

/* ---------- today ---------- */
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); }
.hero h1 .num { font-size: .8em; color: var(--accent); }
.hero p { margin: 6px 0 0; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .v { font: 500 28px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; color: var(--muted); }
.stat .l { font-size: 13px; color: var(--muted); }
.timeline { position: relative; display: grid; grid-template-columns: 112fr 42fr 28fr; gap: 3px; margin-top: 8px; }
.timeline .seg { height: 30px; background: var(--sunken); border-radius: 4px; position: relative; overflow: hidden; }
.timeline .seg > span { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); }
.timeline .seg b { position: relative; font-size: 12px; font-weight: 600; padding: 0 8px; line-height: 30px; white-space: nowrap; color: var(--ink); }
.timeline .marker { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--red); }
.tl-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
.two { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: grid; gap: 24px; min-width: 0; }

/* ---------- task checklist ---------- */
.tasks { display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: auto auto 1fr; gap: 12px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.task:hover { border-color: var(--accent); }
.task input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--accent); cursor: pointer; }
.task .h { font: 500 12px/26px var(--mono); color: var(--muted); }
.task .t { min-width: 0; overflow-wrap: anywhere; }
.task.done { background: var(--sunken); }
.task.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.subj { font-weight: 600; }

/* ---------- routine ---------- */
.months { display: flex; gap: 8px; flex-wrap: wrap; }
.months a { text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; display: grid; gap: 4px; min-width: 120px; }
.months a[aria-current="page"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.months a small { color: var(--muted); font-size: 12px; }
.months .bar { height: 4px; }
.week h3 { font-size: 18px; margin: 8px 0 10px; display: flex; gap: 10px; align-items: baseline; }
.week h3 small { font: 400 13px var(--body); color: var(--muted); }
.days { display: grid; gap: 8px; }
.day { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.day.today { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.day.fri { background: color-mix(in srgb, var(--surface) 88%, var(--amber-soft)); }
.day-meta { display: grid; gap: 4px; align-content: start; }
.day-meta a { text-decoration: none; color: var(--ink); }
.day-meta .dn { font: 500 13px var(--mono); color: var(--muted); }
.day-meta .dd { font-weight: 600; }
.day-meta .badges { display: flex; gap: 4px; flex-wrap: wrap; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; font-size: 14px; line-height: 1.45; padding: 8px; border-radius: 6px; background: var(--paper); cursor: pointer; min-width: 0; }
.slot input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.slot span { min-width: 0; overflow-wrap: anywhere; }
.slot.done { opacity: .6; }
.slot.done span { text-decoration: line-through; }

/* ---------- material (article) ---------- */
.article { max-width: 78ch; }
.article h1 { font-size: 30px; margin: 0 0 12px; }
.article h2 { font-size: 24px; margin: 32px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.article h3 { font-size: 19px; margin: 22px 0 8px; }
.article p, .article li { max-width: 72ch; }
.article hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
.article blockquote { margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.article code { font-family: var(--mono); font-size: .9em; background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
.tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 15px; }
.tbl th, .tbl td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { background: var(--sunken); font-weight: 600; }
.tbl tr:last-child td { border-bottom: 0; }
.article input[type=checkbox] { accent-color: var(--accent); }
.exam-cta { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; padding: 18px 20px; border-radius: var(--radius); border: 1px dashed var(--accent); background: var(--accent-soft); margin: 20px 0; }
.exam-cta h3 { margin: 0; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* ---------- exam ---------- */
.exam-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; box-shadow: 0 4px 16px rgb(0 0 0 / .06); }
.exam-bar .title { font-weight: 600; }
.timer { font: 500 26px/1 var(--mono); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--red); }
.exam-bar .spacer { flex: 1; }
.part-h { font-size: 20px; margin: 8px 0 0; }
.qs { display: grid; gap: 12px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.q .qt { display: grid; grid-template-columns: 2.4em 1fr; gap: 6px; font-size: 17px; }
.q .qt .n { font: 500 15px/1.9 var(--mono); color: var(--muted); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0 0 2.4em; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; min-width: 0; }
.opt .bub { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 14px; font-weight: 600; color: var(--muted); }
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .bub { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .bub { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.wrong .bub { background: var(--red); border-color: var(--red); color: #fff; }
.opt[disabled] { cursor: default; }
.q.r-wrong { border-left: 4px solid var(--red); }
.q.r-right { border-left: 4px solid var(--good); }
.q.r-skip { border-left: 4px solid var(--muted); }
.explain { margin: 10px 0 0 2.4em; padding: 8px 12px; background: var(--sunken); border-radius: 8px; font-size: 15px; }
.omr { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; }
.omr a { font: 500 12px/30px var(--mono); text-align: center; border-radius: 6px; border: 1px solid var(--line); text-decoration: none; color: var(--muted); }
.omr a.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.omr a.right { background: var(--good); border-color: var(--good); color: #fff; }
.omr a.wrong { background: var(--red); border-color: var(--red); color: #fff; }
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--surface); border-radius: 12px; padding: 24px; max-width: 420px; width: 100%; display: grid; gap: 14px; border: 1px solid var(--line); }
.score { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
.score .big { font: 500 56px/1 var(--mono); }
.score .big small { font-size: 22px; color: var(--muted); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.attempts { display: grid; gap: 8px; }
.attempt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(80px, 200px) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.attempt:last-child { border-bottom: 0; }
.attempt .bar > span.neg { background: var(--red); }
.exams-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.tl { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-underline-offset: 3px; }
.tl:hover { color: var(--accent); text-decoration-color: var(--accent); }
.topic-list { padding: 4px 20px; }
.topic-row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.topic-row:last-child { border-bottom: 0; }
.topic-row:hover strong { color: var(--accent); }
.topic-row.done strong { color: var(--muted); }
.subjects { display: grid; gap: 10px; }
.subjects .s { display: grid; grid-template-columns: minmax(0, 170px) 1fr auto; gap: 12px; align-items: center; font-size: 14px; }
.subjects .s .num { color: var(--muted); font-size: 13px; }
.backlog a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.backlog a:last-child { border-bottom: 0; }

@media (max-width: 900px) {
  .two { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .day { grid-template-columns: 1fr; }
  .day-meta { grid-template-columns: auto auto 1fr; align-items: baseline; gap: 8px; }
  .slots { grid-template-columns: 1fr; }
  .opts { grid-template-columns: 1fr; margin-left: 0; }
  .explain { margin-left: 0; }
  .subjects .s { grid-template-columns: minmax(0, 120px) 1fr auto; }
  .attempt { grid-template-columns: minmax(0, 1fr) auto; }
  .topic-row { grid-template-columns: 2em minmax(0, 1fr); }
  .topic-row > .row { grid-column: 2; }
  .attempt .bar { grid-column: 1 / -1; }
  .timeline .seg b { font-size: 11px; padding: 0 4px; }
  .sync { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar > span { transition: width .3s ease; }
}
</style>

,"has":true,"quizCount":9,"days":[[85,3],[148,3]]},{"id":"ETH-14","code":"ETH","subject":"Ethics & Governance","title":"Emotional intelligence & professional integrity","hot":false,"has":true,"quizCount":8,"days":[[92,3],[148,3]]}],"guide":"# BCS Preparation: 6-Month Study Guideline (4 Hours a Day)\n\n**Plan period:** 1 October 2026 → 31 March 2027 (182 days)\n**Daily study:** 4 hours (4 blocks of 50 min study + 10 min break)\n**Weekly rhythm:** Saturday–Thursday = new topics / revision · Friday = test + review\n\n> Check the latest BCS circular and syllabus on the PSC website (bpsc.gov.bd) before you start. If the exam pattern or date changes, keep the order of topics and move the dates.\n\n---\n\n## 1. Know the exam\n\n### Preliminary (MCQ): 200 marks, 2 hours, −0.5 for each wrong answer\n\n| Subject | Marks | Hours per week in this plan |\n|---|---|---|\n| Bangla Language & Literature | 35 | 4 |\n| English Language & Literature | 35 | 4 |\n| Bangladesh Affairs | 30 | 3 |\n| International Affairs | 20 | 2 |\n| Geography, Environment & Disaster Management | 10 | 1 |\n| General Science | 15 | 2 |\n| Computer & Information Technology | 15 | 2 |\n| Mathematical Reasoning | 15 | 3 |\n| Mental Ability | 15 | 2 |\n| Ethics, Values & Good Governance | 10 | 1 |\n| **Total** | **200** | **24 + Friday** |\n\nHours follow the marks. Math gets a little extra because it only improves with regular practice.\n\n### Written (general cadre): 900 marks\nBangla 200 · English 200 · Bangladesh Affairs 200 · International Affairs 100 · Math & Mental Ability 100 · General Science & Technology 100.\n**Viva:** 200 marks.\n\nThis 6-month plan targets the **Preliminary**. Everything you learn here is also the base for the Written exam. Start Written-specific practice (essays, translation, analytical writing) after the Preliminary.\n\n---\n\n## 2. The three phases\n\n| Phase | Days | Dates | Goal |\n|---|---|---|---|\n| **1. Foundation** | 1–112 (16 weeks) | 1 Oct 2026 – 20 Jan 2027 | Study the full syllabus once, one topic per hour. Make short notes. Weekly test every Friday, and a 200-mark monthly model test on the last Friday of each month. |\n| **2. Revision + PYQ** | 113–154 (6 weeks) | 21 Jan – 3 Mar 2027 | Revise every topic a second time, 2–3 topics per hour. Solve **previous BCS questions (10th–latest)** for each topic. Subject test every Friday. |\n| **3. Model tests** | 155–182 (4 weeks) | 4 Mar – 31 Mar 2027 | 11 full 200-mark model tests (Sat/Mon/Wed), rapid revision of hot topics on the other days, final look in the last 2 days. |\n\n---\n\n## 3. Weekly template (Phases 1 and 2)\n\n| Day | Hour 1 | Hour 2 | Hour 3 | Hour 4 |\n|---|---|---|---|---|\n| Saturday | Math | Bangla | English | Bangladesh Affairs |\n| Sunday | Mental Ability | English | Bangla | International Affairs |\n| Monday | Math | Bangla | General Science | Computer & ICT |\n| Tuesday | Mental Ability | English | Bangladesh Affairs | Geography & Disaster |\n| Wednesday | Math | Bangla | English | General Science |\n| Thursday | Bangladesh Affairs | International Affairs | Computer & ICT | Ethics & Governance |\n| **Friday** | Test | Test analysis / current affairs | Revision | Backlog |\n\n- Bangla and English alternate between **language (grammar)** and **literature**, so you cover both every week.\n- The hardest subject (Math/Mental) comes first, while your mind is fresh.\n\n---\n\n## 4. Suggested daily timing (pick one)\n\n| Option | Session 1 (Hours 1–2) | Session 2 (Hours 3–4) |\n|---|---|---|\n| **A. Job holder** | 5:30 – 7:30 AM | 8:30 – 10:30 PM |\n| **B. Full-time candidate** | 8:00 – 10:00 AM | 3:00 – 5:00 PM |\n| **C. Student** | 6:30 – 8:30 AM | 7:30 – 9:30 PM |\n\nEach hour: **50 min study → 10 min break** (walk, water, no social media).\nOptional daily extra: **15 min newspaper** for current affairs (Prothom Alo / The Daily Star, editorial + national + international pages).\n\n---\n\n## 5. How to study each hour (the 50-minute method)\n\n1. **10 min:** Read the topic from the textbook or guide.\n2. **20 min:** Write **short notes** in your own notebook (one notebook per subject). Put key facts, dates and formulas in a box.\n3. **15 min:** Solve **previous BCS MCQs** on that topic (from a question bank).\n4. **5 min:** Write the mistakes in a **\"Mistake Notebook\"**. This notebook is what you revise in the final month.\n\n---\n\n## 6. Negative-marking strategy (−0.5)\n\n- Answer when you are **sure**, or when you can **eliminate 2 of the 4 options**. That is a good bet.\n- If you are completely blind on a question, skip it.\n- A safe target: attempt **160–175**, with **85%+ accuracy**. That usually clears the cutoff comfortably.\n- In every model test, record: attempted · correct · wrong · net score. Track the trend in a table.\n\n---\n\n## 7. Books and resources\n\n| Subject | Resources |\n|---|---|\n| Base for all subjects | **NCTB textbooks, Classes 6–10** (Bangla grammar, BGS, Science, ICT, Math) |\n| Previous questions | Any complete BCS question bank with explanations (e.g. *Jobs Solution*, *Professor's*, *MP3*) |\n| Bangla | NCTB *Bangla Bhasar Byakoron* (Class 9–10), a BCS Bangla literature guide |\n| English | A grammar book (e.g. *Saifur's*), a vocabulary book, a BCS English literature guide |\n| Math | *Khairul's Basic Math* or a similar book, NCTB Class 8–10 math |\n| Bangladesh Affairs | **Constitution of Bangladesh**, **Bangladesh Economic Review** (Finance Division), BBS Census 2022 summary |\n| International Affairs | A monthly current affairs magazine, an international affairs guide |\n| Current affairs | Daily newspaper and a monthly magazine; make a one-page summary each month |\n\nDon't collect too many books. **One main book per subject plus a question bank is enough.** Revise the same book many times.\n\n---\n\n## 8. Golden rules\n\n1. **Consistency beats intensity.** 4 hours every day for 6 months is better than 10 hours for a few days.\n2. **Hot topics first** (🔥 in the routine). About 20% of topics produce about 60% of the questions.\n3. **Revise every Friday.** Without revision you will forget about 70% within a month.\n4. **Previous questions are your syllabus map.** Many questions repeat or come from the same area.\n5. **Don't skip the tests.** The exam is 2 hours of pressure, and only timed tests train you for that.\n6. **Missed a day?** Don't panic or skip ahead. Use Friday's \"Backlog\" hour to catch up.\n7. Sleep 7 hours, exercise 20 minutes, and eat properly. Your brain is your main tool.\n\n---\n\n## 9. Files in this folder\n\n| File | What it has |\n|---|---|\n| `00_Study_Guideline.md` | This guide |\n| `01_October_2026.md` | Days 1–31 (Phase 1) |\n| `02_November_2026.md` | Days 32–61 (Phase 1) |\n| `03_December_2026.md` | Days 62–92 (Phase 1) |\n| `04_January_2027.md` | Days 93–123 (Phase 1 → Phase 2) |\n| `05_February_2027.md` | Days 124–151 (Phase 2) |\n| `06_March_2027.md` | Days 152–182 (Phase 2 → Phase 3, final) |\n| `07_Hot_Topics_Checklist.md` | All 🔥 topics by subject, with 3 revision tick-boxes |\n\nEach month file has a day-by-day table (tick ☐ → ☑ when done) and a **month-end checklist** of all topics studied that month.\n\n**Best of luck!**\n","hot":"# 🔥 Hot Topics Checklist — BCS Preliminary\n\nThese topics are asked most often in previous BCS exams. Revise each at least 3 times before the exam.\n\n| Subject | Marks |\n|---|---|\n| Bangla | 35 |\n| English | 35 |\n| Bangladesh Affairs | 30 |\n| International Affairs | 20 |\n| Geography & Disaster | 10 |\n| General Science | 15 |\n| Computer & ICT | 15 |\n| Math | 15 |\n| Mental Ability | 15 |\n| Ethics & Governance | 10 |\n| **Total** | **200** |\n\nRevision rounds: ☐ = Round 1 (Phase 1) · ☐ = Round 2 (Phase 2) · ☐ = Round 3 (Phase 3)\n\n## Bangla (35 marks)\n\n- ☐ ☐ ☐ ভাষার উৎপত্তি, বাংলা ভাষার ইতিহাস ও উপভাষা\n- ☐ ☐ ☐ সাহিত্যের যুগবিভাগ ও চর্যাপদ\n- ☐ ☐ ☐ ধ্বনি ও বর্ণ (স্বর/ব্যঞ্জন)\n- ☐ ☐ ☐ মঙ্গলকাব্য (মনসা, চণ্ডী, অন্নদা)\n- ☐ ☐ ☐ বৈষ্ণব পদাবলি, অনুবাদ সাহিত্য, আরাকান রাজসভা (আলা  ☐ ☐ Algebraic formulas & identities\n- ☐ ☐ ☐ Factorization\n- ☐ ☐ ☐ Logarithm\n- ☐ ☐ ☐ Sets & Venn diagram\n- ☐ ☐ ☐ Arithmetic progression (সমান্তর ধারা)\n- ☐ ☐ ☐ Triangles & Pythagoras theorem\n- ☐ ☐ ☐ Quadrilaterals & polygons (interior/exterior angles)\n- ☐ ☐ ☐ Circle: chord, tangent, arc, angles\n- ☐ ☐ ☐ Mensuration: triangle, rectangle, square\n- ☐ ☐ ☐ Trigonometric ratios & identities\n- ☐ ☐ ☐ Permutation\n- ☐ ☐ ☐ Combination\n- ☐ ☐ ☐ Probability\n\n## Mental Ability (15 marks)\n\n- ☐ ☐ ☐ Classification / odd one out\n- ☐ ☐ ☐ Number series\n- ☐ ☐ ☐ Letter series & alphabet test\n- ☐ ☐ ☐ Coding-decoding\n- ☐ ☐ ☐ Blood relations\n- ☐ ☐ ☐ Direction sense\n- ☐ ☐ ☐ Clock problems\n- ☐ ☐ ☐ Calendar problems\n- ☐ ☐ ☐ Syllogism / logical deduction\n- ☐ ☐ ☐ Mirror & water images\n- ☐ ☐ ☐ Counting figures (triangles, squares)\n- ☐ ☐ ☐ Dice & cube\n- ☐ ☐ ☐ Mechanical: gears, pulleys, levers\n\n## Ethics & Governance (10 marks)\n\n- ☐ ☐ ☐ Ethics & morality: concept, sources\n- ☐ ☐ ☐ Values: types, social values, values education\n- ☐ ☐ ☐ Ethical theories: Kant, utilitarianism, virtue ethics\n- ☐ ☐ ☐ Socrates, Plato, Aristotle & famous quotes\n- ☐ ☐ ☐ Good governance: concept & indicators\n- ☐ ☐ ☐ Rule of law, accountability, transparency\n- ☐ ☐ ☐ Law, liberty & equality\n- ☐ ☐ ☐ National Integrity Strategy (NIS) 2012\n- ☐ ☐ ☐ RTI Act 2009, Citizen Charter, Ombudsman\n","materials":{"1":{"file":"materials/Week_01/Day_001_2026-10-01_Study_Material.md","md":"# Day 1 — Thursday, 01 October 2026\n\n| Hour | Subject | Topic |\n|---|---|---|\n| 1 | Bangladesh Affairs | Ancient Bengal: janapadas, Maurya, Gupta, Shashanka |\n| 2 | International Affairs | 🔥 Concepts: state, sovereignty, geopolitics, balance of power |\n| 3 | Computer & ICT | 🔥 History & generations of computers |\n| 4 | Ethics & Governance | 🔥 Ethics & morality: concept, sources |\n\nEach hour: **10 min read → 20 min write short notes → 15 min self-check questions → 5 min mistake notebook.**\nTomorrow (Friday) you take **Weekly Test #1** on all four topics: [Day_002_2026-10-02_Weekly_Test_1.md](Day_002_2026-10-02_Weekly_Test_1.md)\n\n---\n\n## Hour 1 — Bangladesh Affairs: Ancient Bengal (প্রাচীন বাংলা)\n\n### 1.1 The name \"Bangla / Bengal\"\n- The word **\"বঙ্গ\" (Vanga)** is first mentioned in the **ঐতরেয় আরণ্যক (Aitareya Aranyaka)**.\n- **আবুল ফজল**, in **আইন-ই-আকবরী**, explained \"Bangal\" as **বঙ্গ + আল** (আল = embankment/dyke).\n- Sultan **শামসুদ্দিন ইলিয়াস শাহ** united the whole region in the 14th century and took the title **\"শাহ-ই-বাঙ্গালাহ\"**. From then on, the whole region was called **\"বাঙ্গালাহ\"**.\n\n### 1.2 Ancient janapadas (প্রাচীন জনপদ) 🔥\nIn ancient times Bengal was not one country. It was divided into many small regions called **জনপদ**.\n\n| Janapada | Present-day area | Key fact |\n|---|---|---|\n| **পুণ্ড্র (Pundra)** | Bogura, Rajshahi, Dinajpur (North Bengal) | **Oldest janapada.** Capital **পুণ্ড্রনগর = মহাস্থানগড়** (Bogura) |\n| **বরেন্দ্র (Varendra)** | Bogura, Rajshahi, Dinajpur | Part of Pundra; between the Ganga and the Karatoya |\n| **বঙ্গ (Vanga)** | Dhaka, Faridpur, Bikrampur area | The name \"Bangladesh\" comes from this |\n| **গৌড় (Gauda)** | Murshidabad, Malda, Chapainawabganj | Shashanka's kingdom |\n| **সমতট (Samatata)** | **Cumilla & Noakhali** | Mentioned in Samudragupta's Allahabad inscription |\n| **হরিকেল (Harikela)** | Eastern Bengal (Sylhet – Chattogram) | |\n| **চন্দ্রদ্বীপ (Chandradwip)** | **Barishal** | Old name of Barishal |\n| **রাঢ় (Radha)** | West of the Bhagirathi (West Bengal) | |\n| **তাম্রলিপ্ত (Tamralipta)** | Midnapore (West Bengal) | Famous ancient seaport |\n| **শ্রীহট্ট (Srihatta)** | Sylhet | |\n\n### 1.3 Important archaeological sites\n- **মহাস্থানগড় (Bogura):** on the bank of the **করতোয়া** river. It is the **oldest city-site** in Bangladesh. The **Mahasthan Brahmi inscription** (Maurya period) found here is the oldest inscription found in Bangladesh.\n- **উয়ারী-বটেশ্বর (Narsingdi):** a fort-city about **2,500 years old**. Jahangirnagar University has excavated it since 2000. It shows ancient trade links.\n\n### 1.4 Gangaridai and Alexander\n- **Alexander the Great** invaded India in **326 BCE**.\n- Greek writers mention a powerful kingdom called **গঙ্গারিডই (Gangaridai)** in the Ganges delta. Its strength was one reason Alexander did not advance further east.\n\n### 1.5 Maurya Empire (মৌর্য সাম্রাজ্য)\n- Founder: **চন্দ্রগুপ্ত মৌর্য** (c. 321 BCE). Capital: **পাটলিপুত্র**.\n- His adviser **কৌটিল্য (চাণক্য)** wrote **\"অর্থশাস্ত্র\"**.\n- Greek ambassador **মেগাস্থিনিস** wrote **\"ইন্ডিকা\"**.\n- **সম্রাট অশোক** accepted **Buddhism** after the **Kalinga War (261 BCE)**.\n- North Bengal (Pundra) was part of the Maurya Empire. The Mahasthan Brahmi inscription is the proof.\n\n### 1.6 Gupta Empire (গুপ্ত সাম্রাজ্য)\n- Founder: **শ্রীগুপ্ত**. **প্রথম চন্দ্রগুপ্ত** started the Gupta era in **320 CE**.\n- **সমুদ্রগুপ্ত** is called the **\"Napoleon of India\"**. His **Allahabad pillar inscription** (written by Harisena) names **সমতট** as a frontier kingdom.\n- **দ্বিতীয় চন্দ্রগুপ্ত (বিক্রমাদিত্য):** Chinese traveller **ফা-হিয়েন** visited India in his reign.\n- The Gupta period is called the **\"Golden Age\"** of ancient India.\n\n### 1.7 Shashanka (শশাঙ্ক) 🔥\n- The **first independent, sovereign king of Bengal (বাংলার প্রথম স্বাধীন সার্বভৌম রাজা)**.\n- Kingdom: **গৌড়**. Capital: **কর্ণসুবর্ণ** (Murshidabad, West Bengal).\n- His main rival was **হর্ষবর্ধন** of Thaneswar/Kanauj.\n- Chinese traveller **হিউয়েন সাং** visited Bengal in the 7th century.\n\n### 1.8 Matsyanyaya (মাৎস্যন্যায়)\n- After Shashanka's death, Bengal fell into anarchy for about **100 years (mid-7th to mid-8th century)**.\n- **মাৎস্যন্যায়** means \"the rule of fish\": big fish eat small fish, the strong oppress the weak.\n- It ended when the leaders chose **গোপাল** as king (c. 750 CE). Gopala founded the **পাল বংশ**, which you will study on Saturday.\n\n**Memory hook:** *পুণ্ড্র প্রাচীন → মৌর্য → গুপ্ত → শশাঙ্ক (প্রথম স্বাধীন) → মাৎস্যন্যায় → গোপাল (পাল)*\n\n---\n\n## Hour 2 — International Affairs: Core Concepts 🔥\n\n### 2.1 State (রাষ্ট্র)\nA state has **four elements**:\n1. **Population** (জনসমষ্টি)\n2. **Territory** (নির্দিষ্ট ভূখণ্ড)\n3. **Government** (সরকার)\n4. **Sovereignty** (সার্বভৌমত্ব). **This is the most important element.** It separates a state from other organizations.\n\n- The **Montevideo Convention (1933)** set the legal criteria for statehood: permanent population, defined territory, government, and the capacity to enter into relations with other states.\n- **Nation (জাতি)** is a people united by language, culture, history and a common feeling. **State** is a political-legal unit. A nation can exist without a state. The Kurds and the Palestinians are examples.\n\n### 2.2 Sovereignty (সার্বভৌমত্ব)\n- It means supreme power, both **internal** (over everyone inside the state) and **external** (freedom from outside control).\n- **Jean Bodin (জ্যাঁ বোদাঁ)** is the **father of the modern theory of sovereignty**. His book is *Six Books of the Commonwealth* (1576).\n- **Thomas Hobbes** wrote ***Leviathan*** (1651): an absolute sovereign is needed to escape the \"state of nature\".\n- **John Austin** gave the **legal (monistic) theory** of sovereignty.\n- **Rousseau** gave the idea of **popular sovereignty** (*The Social Contract*, 1762).\n- The **Treaty of Westphalia (1648)** ended the Thirty Years' War and started the **modern sovereign nation-state system**.\n\n### 2.3 Geopolitics (ভূ-রাজনীতি)\nIt studies how geography (location, resources, seas, borders) shapes politics and power.\n\n| Person | Contribution |\n|---|---|\n| **Rudolf Kjellén** (Sweden) | **First used the term \"geopolitics\"** (1899) |\n| **Friedrich Ratzel** (Germany) | \"Lebensraum\" (living space); state as an organism |\n| **Alfred Thayer Mahan** (USA) | **Sea-power theory**, *The Influence of Sea Power upon History* (1890) |\n| **Halford Mackinder** (UK) | **Heartland theory** (1904): \"Who rules the Heartland commands the World-Island…\" |\n| **Nicholas Spykman** (USA) | **Rimland theory**: control of the coastal rim of Eurasia is the key |\n\n### 2.4 Balance of power (ক্ষমতার ভারসাম্য)\n- Power is spread so that **no single state can dominate** the others. If one state grows too strong, others unite against it.\n- Classic example: the **Congress of Vienna (1815)** and the \"Concert of Europe\" after Napoleon.\n- World systems: **unipolar** (one superpower), **bipolar** (two, as in the Cold War), **multipolar** (many).\n\n### 2.5 Key thinkers and terms\n| Term / book | Person |\n|---|---|\n| ***The Prince*** (power politics, \"end justifies the means\") | **Niccolò Machiavelli** |\n| ***Arthashastra*** | **Kautilya** |\n| ***Politics Among Nations*** (1948), **classical realism** | **Hans J. Morgenthau** |\n| **Neo-realism**, *Theory of International Politics* (1979) | **Kenneth Waltz** |\n| **Soft power** (attraction through culture and values) | **Joseph Nye** |\n| **\"Iron Curtain\"** speech (1946) | **Winston Churchill** |\n| **Détente** | Easing of US–USSR tension in the 1970s |\n| **Buffer state** | A small state between two rival powers (e.g. Nepal, Bhutan) |\n\n---\n\n## Hour 3 — Computer & ICT: History & Generations of Computers 🔥\n\n### 3.1 Early calculating devices\n| Device | Inventor / year |\n|---|---|\n| **Abacus** | Earliest calculating device (ancient Mesopotamia/China) |\n| **Napier's Bones** | John Napier, 1617 |\n| **Slide rule** | William Oughtred, 1622 |\n| **Pascaline**, the **first mechanical calculator** (addition/subtraction) | **Blaise Pascal, 1642** |\n| Stepped Reckoner (could multiply) | Gottfried Leibniz, 1673 |\n| Punched-card loom | Joseph Marie Jacquard, 1801 |\n\n### 3.2 Pioneers 🔥\n- **Charles Babbage** is the **father of the computer**. He designed the **Difference Engine** (1822) and the **Analytical Engine** (1830s). The Analytical Engine had a \"mill\" (like a CPU) and a \"store\" (like memory).\n- **Ada Lovelace** is the **first computer programmer**. She wrote an algorithm for the Analytical Engine.\n- **Herman Hollerith** built a punched-card tabulating machine for the **1890 US census**. His company later became **IBM**.\n- **Alan Turing** proposed the **Turing Machine** (1936). He is called the father of theoretical computer science and AI.\n- **John von Neumann** gave the **stored-program concept**: program and data are kept in the same memory.\n- **Howard Aiken** built the **Mark I** (1944), an electromechanical computer, at Harvard with IBM.\n- **ENIAC** (1946) was the first general-purpose electronic computer. It was built by **J. Presper Eckert & John Mauchly** and used about **18,000 vacuum tubes**.\n- **UNIVAC I** (1951) was the **first commercial computer**.\n\n### 3.3 Generations of computers 🔥🔥 (most asked)\n| Generation | Period | Main technology | Features / examples |\n|---|---|---|---|\n| **1st** | 1946–1958 | **Vacuum tube** | Huge, very hot, machine language. ENIAC, EDVAC, UNIVAC I, IBM 650 |\n| **2nd** | 1959–1964 | **Transistor** (invented 1947, Bell Labs) | Smaller, faster; assembly & high-level languages (**FORTRAN, COBOL**); magnetic core memory. IBM 1401, **IBM 1620** |\n| **3rd** | 1965–1971 | **Integrated Circuit (IC)** (Jack Kilby & Robert Noyce) | Operating systems, keyboard, monitor. IBM System/360 |\n| **4th** | 1971–present | **Microprocessor**, VLSI | Personal computers. **First microprocessor: Intel 4004 (1971)**. IBM PC (1981) |\n| **5th** | Present & future | **AI**, ULSI, parallel processing | Natural-language processing, robotics, quantum computing |\n\n**Memory hook:** *Tube → Transistor → IC → Microprocessor → AI*\n\n### 3.4 Computers in Bangladesh\n- The **first computer in Bangladesh** was an **IBM 1620** (a 2nd-generation computer). It was installed in **1964** at the **Atomic Energy Centre, Dhaka**.\n- **Bijoy** Bangla keyboard: **Mustafa Jabbar** (1988). **Avro** keyboard: **Mehdi Hasan Khan** (2003).\n\n---\n\n## Hour 4 — Ethics & Governance: Ethics & Morality: Concept and Sources 🔥\n\n### 4.1 Meaning\n- **Ethics (নৈতিকতা/নীতিবিদ্যা)** comes from the Greek word **\"ethos\"**, meaning custom, habit or character.\n- **Morality (নৈতিকতা/নীতি)** comes from the Latin word **\"mores\"**, meaning customs or manners.\n- Ethics is the **systematic study of right and wrong, good and bad** in human conduct.\n- Ethics is a **normative science (আদর্শনিষ্ঠ বিজ্ঞান)**. It studies **what ought to be**, not just what is.\n- Ethics is a branch of **philosophy**.\n\n### 4.2 Branches of ethics\n| Branch | What it studies |\n|---|---|\n| **Meta-ethics** | The meaning and nature of moral words (\"good\", \"right\") |\n| **Normative ethics** | Standards for right and wrong action (e.g. utilitarianism, Kant's duty ethics) |\n| **Applied ethics** | Real-life issues: **business ethics, bioethics, environmental ethics**, professional ethics |\n| **Descriptive ethics** | What people actually believe is moral |\n\n### 4.3 Ethics vs morality\n| Ethics | Morality |\n|---|---|\n| A theoretical, systematic study | Practical, personal belief and behaviour |\n| Often set by a system or profession (code of ethics) | Comes from culture, religion and upbringing |\n| More universal | Can differ from person to person and society to society |\n\n### 4.4 Sources of ethics and morality 🔥\n1. **Religion:** the strongest traditional source.\n2. **Family:** the first school of morality.\n3. **Society, customs and culture.**\n4. **Conscience (বিবেক):** the **inner source**, often called the \"inner voice\".\n5. **Law:** it supports morality, but it is an outer source.\n6. **Education and philosophy (reason).**\n7. **Literature, role models and institutions.**\n\n### 4.5 Morality vs law\n| Law | Morality |\n|---|---|\n| Made and **enforced by the state** | Enforced by conscience and society |\n| Breaking it brings **legal punishment** (sanction) | Breaking it brings guilt or social disapproval |\n| Deals mainly with **outward actions** | Deals with **both intention and action** |\n\n### 4.6 Key thinkers (starter list, more on Thursdays ahead)\n- **Socrates** is regarded as the founder of moral philosophy. He said **\"Virtue is knowledge\"** and taught **\"Know thyself\"**.\n- **Aristotle** wrote ***Nicomachean Ethics***, the first systematic book on ethics. His \"golden mean\" says virtue is the middle path between extremes.\n- **Jeremy Bentham** founded **utilitarianism**: **\"the greatest happiness of the greatest number\"**.\n- **Immanuel Kant** founded duty-based ethics: act only by a rule you would want everyone to follow (**categorical imperative**).\n\n---\n\n## End-of-day self-check (5 min, answer without looking)\n1. Oldest janapada of Bengal and its capital?\n2. Who was the first independent king of Bengal? His capital?\n3. What is the most important element of a state?\n4. Who proposed the Heartland theory? The Rimland theory?\n5. Which technology defines each of the 5 generations of computers?\n6. What was the first computer in Bangladesh, and when was it installed?\n7. From which languages do \"ethics\" and \"morality\" come?\n8. Name the inner source of morality.\n\nAll answers are in the notes above. Circle any you missed and re-read them before tomorrow's test.\n","examId":null},"2":{"file":"materials/Week_01/Day_002_2026-10-02_Weekly_Test_1.md","md":"# Day 2 — Friday, 02 October 2026: Weekly Test #1\n\n| Hour | Task |\n|---|---|\n| 1 | 📝 **Weekly Test #1**: 50 MCQ, **35 minutes**, then check answers and analyse (25 min) |\n| 2 | **Current affairs**: build this week's news notes (method below) |\n| 3 | **Revision**: re-read all 🔥 topics from Day 1 and update your short notes |\n| 4 | **Backlog**: finish anything missed on Day 1; otherwise redo every question you got wrong |\n\n**Syllabus for this test:** everything in [Day_001_2026-10-01_Study_Material.md](Day_001_2026-10-01_Study_Material.md)\n(Bangladesh Affairs 15 · International Affairs 12 · Computer & ICT 13 · Ethics 10)\n\n---\n\n\n\u003c!--EXAM-->\n\n## Hour 2 — Current affairs note-building method\nCollect this week's news from a newspaper or a trusted news site, and write **one line per fact** in a \"Current Affairs\" notebook:\n\n| Category | What to note |\n|---|---|\n| Bangladesh | New appointments (ministers, heads of commissions/institutions), new laws or ordinances, economic data (inflation, reserves, remittance, exports), mega projects, awards |\n| International | Summits (UN General Assembly is in session in September/October), elections, conflicts (Gaza, Ukraine, Myanmar), new heads of state/government |\n| Prizes & days | **Nobel Prizes are announced in early October.** Note each winner, their country and the field |\n| Sports | Major tournaments and records |\n| Indices & reports | Any new global index or ranking with Bangladesh's position |\n\nWrite each item as a possible MCQ, for example: *\"Who won the Nobel Prize in Literature 2026?\"*\n\n## Hour 3 — Revision checklist\n- [ ] Janapada table: can you write all 10 with their present-day areas from memory?\n- [ ] Maurya → Gupta → Shashanka → Matsyanyaya → Gopala sequence\n- [ ] Four elements of a state, and the sovereignty thinkers (Bodin, Hobbes, Austin, Rousseau)\n- [ ] Geopolitics table (Kjellén, Ratzel, Mahan, Mackinder, Spykman)\n- [ ] Five generations table: technology, period and example for each\n- [ ] Ethics: ethos/mores, the four branches, the sources, law vs morality\n\n## Hour 4 — Backlog\nIf you finished everything on Day 1, redo every wrong question without looking, then read tomorrow's first topics (**Math: number system**, **Bangla: ভাষার উৎপত্তি**).\n","examId":"day-2"}},"exams":[{"id":"day-2","day":2,"title":"Weekly Test #1","minutes":35,"questions":[{"n":1,"part":"Bangladesh Affairs","text":"বাংলার প্রাচীনতম জনপদ কোনটি?","options":[{"key":"ক","text":"বঙ্গ"},{"key":"খ","text":"পুণ্ড্র"},{"key":"গ","text":"গৌড়"},{"key":"ঘ","text":"সমতট"}],"answer":"খ"},{"n":2,"part":"Bangladesh A
